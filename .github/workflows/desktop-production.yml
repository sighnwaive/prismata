name: Desktop production builds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers to a GitHub Release (run on a version tag)
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows (NSIS installer)
            runner: windows-2022
            target: win
            artifact: apps/desktop/release/*.exe
          - platform: Linux (AppImage)
            runner: ubuntu-latest
            target: linux
            artifact: apps/desktop/release/*.AppImage
          - platform: macOS (DMG)
            runner: macos-latest
            target: mac
            artifact: apps/desktop/release/*.dmg
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up MSVC x64 build environment
        if: matrix.target == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: pnpm install --frozen-lockfile
      - name: Test desktop package
        run: pnpm run test
        working-directory: apps/desktop
      - name: Validate desktop Joystick configuration
        run: |
          node -e 'if (!process.env.JOYSTICK_CLIENT_ID?.trim()) { console.error("Missing required GitHub Actions secret: JOYSTICK_CLIENT_ID"); process.exit(1); }'
        env:
          JOYSTICK_CLIENT_ID: ${{ secrets.JOYSTICK_CLIENT_ID }}
      - name: Configure Windows code signing environment
        if: matrix.target == 'win'
        shell: pwsh
        env:
          CERTIFICATE: ${{ secrets.WIN_CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          function Add-GitHubEnvironmentVariable {
            param([string]$Name, [string]$Value)
            if (![string]::IsNullOrWhiteSpace($Value)) {
              $delimiter = [guid]::NewGuid().ToString()
              "$Name<<$delimiter" >> $env:GITHUB_ENV
              $Value >> $env:GITHUB_ENV
              "$delimiter" >> $env:GITHUB_ENV
            }
          }
          Add-GitHubEnvironmentVariable 'WIN_CSC_LINK' $env:CERTIFICATE
          Add-GitHubEnvironmentVariable 'WIN_CSC_KEY_PASSWORD' $env:CERTIFICATE_PASSWORD
      - name: Configure macOS code signing environment
        if: matrix.target == 'mac'
        shell: bash
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          write_github_env() {
            local name="$1" value="$2" delimiter
            [ -n "$value" ] || return 0
            delimiter="$(uuidgen)"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }
          write_github_env CSC_LINK "$MAC_CERTIFICATE"
          write_github_env CSC_KEY_PASSWORD "$MAC_CERTIFICATE_PASSWORD"
          write_github_env APPLE_ID "$MAC_APPLE_ID"
          write_github_env APPLE_APP_SPECIFIC_PASSWORD "$MAC_APPLE_APP_SPECIFIC_PASSWORD"
          write_github_env APPLE_TEAM_ID "$MAC_APPLE_TEAM_ID"
      - name: Build desktop package
        run: pnpm run build:${{ matrix.target }}
        working-directory: apps/desktop
        env:
          JOYSTICK_CLIENT_ID: ${{ secrets.JOYSTICK_CLIENT_ID }}
          JOYSTICK_SCOPES: ${{ secrets.JOYSTICK_SCOPES }}
          JOYSTICK_PROFILE_ENDPOINT: ${{ secrets.JOYSTICK_PROFILE_ENDPOINT }}
          GYP_MSVS_VERSION: ${{ matrix.target == 'win' && '2022' || '' }}
          npm_config_msvs_version: ${{ matrix.target == 'win' && '2022' || '' }}
      - uses: actions/upload-artifact@v6
        with:
          name: prismata-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "Publishing requires a version tag beginning with v followed by a number; got '$RELEASE_TAG'." >&2
            exit 1
          fi
      - name: Download installers
        uses: actions/download-artifact@v6
        with:
          path: release-assets
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No desktop installers were downloaded." >&2
            exit 1
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "Prismata $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
